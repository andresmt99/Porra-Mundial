    .avatar {

    function normalize(value) {
      return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    /* =========================================================
       Render principal y navegación
       ========================================================= */
    function setTab(tabId) {
      state.activeTab = tabId;
      saveState();
      render();
    }

    function renderTabs() {
      document.getElementById("tabs").innerHTML = tabs.map(tab => `
        <button class="tab ${state.activeTab === tab.id ? "active" : ""}" onclick="setTab('${tab.id}')">
          ${tab.label}
        </button>
      `).join("");
    }

    function render() {
      renderTabs();
      const app = document.getElementById("app");
      const views = {
        home: renderHome,
        groups: renderGroups,
        knockout: renderKnockout,
        extras: renderExtras,
        players: renderPlayers,
        rules: renderRules
      };
      app.innerHTML = `<section class="view">${views[state.activeTab]()}</section>`;
    }

    /* =========================================================
       Inicio
       ========================================================= */
    function countdownParts() {
      const diff = Math.max(0, WORLD_CUP_START - new Date());
      return {
        days: Math.floor(diff / 86400000),
        hours: Math.floor(diff / 3600000) % 24,
        minutes: Math.floor(diff / 60000) % 60
      };
    }

    function groupProgress() {
      const complete = groups.filter(group => isGroupComplete(group.id)).length;
      return { complete, total: groups.length, percent: Math.round((complete / groups.length) * 100) };
    }

            </div>

          </article>

          <article class="card card-pad">
            <div class="section-head" style="margin:0 0 16px">
              <div><h2>Progreso del Mundial</h2><p>${state.settings.playedMatches} jugados · ${TOTAL_MATCHES - state.settings.playedMatches} restantes</p></div>
              <strong>${progress}%</strong>
            </div>
            <div class="progress-shell"><div class="progress-bar" style="width:${progress}%"></div></div>
            <div style="margin-top:18px">
              <label class="small">Actualizar partidos jugados</label>
              <input type="number" min="0" max="${TOTAL_MATCHES}" value="${state.settings.playedMatches}" oninput="updatePlayedMatches(this.value)" />
            </div>
          </article>
        </div>

        <div class="section-head"><div><h2>Equipos favoritos</h2><p>Selecciones destacadas para seguir de cerca.</p></div></div>
        <div class="grid four">
          ${["Argentina", "Brasil", "España", "Francia"].map(name => favoriteCard(findTeam(name))).join("")}
        </div>

        <div class="grid two" style="margin-top:18px">
          <article class="card card-pad">
            <h2>Actividad reciente</h2>
            <div class="grid">
              ${renderActivity()}
            </div>
          </article>
          <article class="card card-pad">
            <h2>Estadísticas rápidas</h2>
            <div class="grid three">
              ${metric(state.players.length, "Participantes")}
              ${metric(mostCommonChampion(), "Campeón más votado")}
              ${metric(`${groupProgress().percent}%`, "Grupos completados")}
            </div>
          </article>
        </div>
      `;
    }

    function metric(value, label) {
      return `<div class="metric"><span class="metric-value">${escapeHtml(value)}</span><div class="metric-label">${label}</div></div>`;
    }

    function favoriteCard(team) {
      return `<div class="favorite-card">${flagImg(team.flag, team.name)}<div><strong>${team.name}</strong><div class="small">Grupo ${team.group}</div></div></div>`;
    }

    function renderActivity() {
      const items = [];
      state.players.slice(-3).reverse().forEach(player => items.push(`Nuevo participante: ${player.name}`));
      prediction().activity.slice(-4).forEach(text => items.push(text));
      if (!items.length) return `<div class="empty-state">Todavía no hay actividad. La porra está lista para despegar.</div>`;
      return items.slice(0, 5).map(text => `<div class="activity-item"><span class="rule-icon">•</span><span>${escapeHtml(text)}</span></div>`).join("");
    }

    function mostCommonChampion() {
      const counts = {};
      Object.values(state.predictions).forEach(pred => {
        const champ = pred.extras?.champion;
        if (champ) counts[champ] = (counts[champ] || 0) + 1;
      });
      return Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || "Sin votos";
    }

    function updatePlayedMatches(value) {
      state.settings.playedMatches = Math.max(0, Math.min(TOTAL_MATCHES, Number(value) || 0));
      saveState();
      render();
    }

    /* =========================================================
       Fase de grupos
       ========================================================= */
    function isGroupComplete(groupId) {
      const selected = prediction().groups[groupId];
      return Boolean(selected?.first && selected?.second && selected.first !== selected.second);
    }

    function renderGroups() {
      const progress = groupProgress();
      return `
        <div class="section-head">
          <div><h2>Fase de grupos</h2><p>Selecciona primer y segundo clasificado en cada grupo.</p></div>
          <div style="min-width:220px"><strong>${progress.complete}/${progress.total}</strong><div class="progress-shell"><div class="progress-bar" style="width:${progress.percent}%"></div></div></div>
        </div>
        <div class="grid three">
          ${groups.map(renderGroupCard).join("")}
        </div>
      `;
    }

    function renderGroupCard(group) {
      const pick = prediction().groups[group.id] || {};
      const duplicate = pick.first && pick.second && pick.first === pick.second;
      return `
        <article class="group-card ${isGroupComplete(group.id) ? "is-complete" : ""}">
          <div class="group-title">
            <h3>Grupo ${group.id}</h3>
            ${isGroupComplete(group.id) ? `<span class="qualified">Completo</span>` : `<span class="small">Pendiente</span>`}
          </div>
          ${group.teams.map(([name, flag]) => `
            <div class="team-row">
              <span class="teams-row truncate" style="justify-content:flex-start">${flagImg(flag, name)} ${name}</span>
              ${pick.first === name ? `<span class="qualified">1º</span>` : pick.second === name ? `<span class="qualified">2º</span>` : ""}
            </div>
          `).join("")}
          <div class="select-row">
            ${teamSelect(group, "first", pick.first, "1º clasificado")}
            ${teamSelect(group, "second", pick.second, "2º clasificado")}
          </div>
          <div class="error">${duplicate ? "No puedes repetir selección en el mismo grupo." : ""}</div>
        </article>
      `;
    }

    function teamSelect(group, slot, selected, label) {
      return `
        <select aria-label="${label} Grupo ${group.id}" onchange="updateGroupPick('${group.id}', '${slot}', this.value)">
          <option value="">${label}</option>
          ${group.teams.map(([name, flag]) => `<option value="${name}" ${selected === name ? "selected" : ""}>${flag} ${name}</option>`).join("")}
        </select>
      `;
    }

    function updateGroupPick(groupId, slot, value) {
      const pred = prediction();
      if (!pred.groups[groupId]) pred.groups[groupId] = {};
      pred.groups[groupId][slot] = value;
      pred.activity.unshift(`Predicción de Grupo ${groupId} actualizada`);
      saveState();
      render();
    }

    /* =========================================================
       Eliminatorias
       ========================================================= */
    function qualifiers() {
      const q = {};
      groups.forEach(group => {
        const pick = prediction().groups[group.id] || {};
        q[`${group.id}1`] = pick.first ? findTeam(pick.first) : placeholder(`${group.id}1`);
        q[`${group.id}2`] = pick.second ? findTeam(pick.second) : placeholder(`${group.id}2`);
        const third = group.teams.map(([name]) => name).find(name => name !== pick.first && name !== pick.second);
        q[`${group.id}3`] = third ? findTeam(third) : placeholder(`${group.id}3`);
      });
      return q;
    }

    function placeholder(label) {
      return { name: label, flag: "◇", group: label[0] || "" };
    }

    const r32Template = [
      ["A1", "B2"], ["C1", "D2"], ["E1", "F2"], ["G1", "H2"],
      ["I1", "J2"], ["K1", "L2"], ["B1", "A3"], ["D1", "C3"],
      ["F1", "E3"], ["H1", "G3"], ["J1", "I3"], ["L1", "K3"],
      ["A2", "B3"], ["C2", "D3"], ["E2", "F3"], ["G2", "H3"]
    ];

    const roundNames = {
      r32: "Dieciseisavos",
      r16: "Octavos",
      qf: "Cuartos",
      sf: "Semifinales",
      third: "Tercer puesto",
      final: "Final"
    };

    function buildBracket() {
      const q = qualifiers();
      const r32 = r32Template.map((pair, i) => ({ id: `r32-${i}`, home: q[pair[0]], away: q[pair[1]] }));
      const r16 = nextRound("r16", r32, 8);
      const qf = nextRound("qf", r16, 4);
      const sf = nextRound("sf", qf, 2);
      const final = [{ id: "final-0", home: winnerOf("sf-0"), away: winnerOf("sf-1") }];
      const third = [{ id: "third-0", home: loserOf("sf-0"), away: loserOf("sf-1") }];
      return { r32, r16, qf, sf, third, final };
    }

    function nextRound(key, previous, count) {
      return Array.from({ length: count }, (_, i) => ({
        id: `${key}-${i}`,
        home: winnerOf(previous[i * 2].id),
        away: winnerOf(previous[i * 2 + 1].id)
      }));
    }

    function winnerOf(matchId) {
      const match = prediction().knockout[matchId];
      return match?.winner ? findTeam(match.winner) : placeholder("Por definir");
    }

    function loserOf(matchId) {
      const match = prediction().knockout[matchId];
      if (!match?.winner) return placeholder("Por definir");
      const names = [match.home, match.away];
      const loser = names.find(name => name && name !== match.winner);
      return loser ? findTeam(loser) : placeholder("Por definir");
    }

    function computeWinner(home, away, score) {
      const hg = Number(score.hg);
      const ag = Number(score.ag);
      if (!Number.isFinite(hg) || !Number.isFinite(ag) || score.hg === "" || score.ag === "") return "";
      if (hg > ag) return home.name;
      if (ag > hg) return away.name;
      const hp = Number(score.hp);
      const ap = Number(score.ap);
      if (!Number.isFinite(hp) || !Number.isFinite(ap) || score.hp === "" || score.ap === "" || hp === ap) return "";
      return hp > ap ? home.name : away.name;
    }

    function renderKnockout() {
      const progress = groupProgress();
      if (progress.complete < progress.total) {
        return `
          <div class="card lock-panel">
            <div style="max-width:560px">
              <div class="lock-icon">⌁</div>
              <h2>Eliminatorias bloqueadas</h2>
              <p class="small" style="font-size:16px">Completa primero la fase de grupos para desbloquear las eliminatorias.</p>
              <div class="progress-shell" style="margin-top:22px"><div class="progress-bar" style="width:${progress.percent}%"></div></div>
              <p class="small" style="margin-top:10px">${progress.complete} de ${progress.total} grupos completados</p>
            </div>
          </div>
        `;
      }
      const bracket = buildBracket();
      const champion = winnerOf("final-0");
      return `
        <div class="section-head">
          <div><h2>Eliminatorias</h2><p>Introduce resultados. El ganador avanza automáticamente; usa penaltis si hay empate.</p></div>
        </div>
        ${champion.name !== "Por definir" ? `<article class="card champion-card"><span class="eyebrow">Campeón final</span><h2 style="margin:14px 0 0">${flagImg(champion.flag, champion.name)} ${champion.name}</h2></article>` : ""}
        <div class="bracket" style="margin-top:18px">
          ${Object.entries(bracket).map(([key, matches]) => `
            <div class="round">
              <h3>${roundNames[key]}</h3>
              ${matches.map(match => renderKoMatch(match)).join("")}
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderKoMatch(match) {
      const saved = prediction().knockout[match.id] || {};
      const winner = computeWinner(match.home, match.away, saved);
      if (winner && saved.winner !== winner) {
        saved.winner = winner;
        saved.home = match.home.name;
        saved.away = match.away.name;
        prediction().knockout[match.id] = saved;
        saveState();
      }
      const disabled = match.home.name === "Por definir" || match.away.name === "Por definir";
      return `
        <div class="ko-match">
          ${scoreRow(match, "home", saved, disabled)}
          ${scoreRow(match, "away", saved, disabled)}
          <div class="small">${winner ? `Ganador: ${winner}` : disabled ? "Esperando ganadores anteriores" : "Pendiente de resultado"}</div>
        </div>
      `;
    }

    function scoreRow(match, side, saved, disabled) {
      const team = side === "home" ? match.home : match.away;
      const goalsKey = side === "home" ? "hg" : "ag";
      const pensKey = side === "home" ? "hp" : "ap";
      const isWinner = saved.winner === team.name;
      return `
        <div class="score-team">
          <span class="${isWinner ? "winner-name" : ""} teams-row truncate" style="justify-content:flex-start">${flagImg(team.flag, team.name)} ${team.name}</span>
          <input type="number" min="0" placeholder="G" value="${saved[goalsKey] ?? ""}" ${disabled ? "disabled" : ""} oninput="updateScore('${match.id}', '${match.home.name}', '${match.away.name}', '${goalsKey}', this.value)" />
          <input type="number" min="0" placeholder="P" value="${saved[pensKey] ?? ""}" ${disabled ? "disabled" : ""} oninput="updateScore('${match.id}', '${match.home.name}', '${match.away.name}', '${pensKey}', this.value)" />
        </div>
      `;
    }

    function updateScore(matchId, home, away, key, value) {
      const ko = prediction().knockout;
      if (!ko[matchId]) ko[matchId] = { home, away };
      ko[matchId][key] = value;
      const teamHome = findTeam(home);
      const teamAway = findTeam(away);
      ko[matchId].winner = computeWinner(teamHome, teamAway, ko[matchId]);
      ko[matchId].home = home;
      ko[matchId].away = away;
      prediction().activity.unshift(`Resultado actualizado: ${home} vs ${away}`);
      saveState();
      render();
    }

    /* =========================================================
       Extras y participantes
       ========================================================= */
    function renderExtras() {
      const players = ["Kylian Mbappé", "Lionel Messi", "Erling Haaland", "Vinícius Júnior", "Jude Bellingham", "Lamine Yamal", "Harry Kane", "Lautaro Martínez"];
      const suggestions = {
        champion: ["Argentina", "Brasil", "España", "Francia"],
        runnerUp: ["Inglaterra", "Portugal", "Alemania", "Países Bajos"],
        thirdPlace: ["Uruguay", "Colombia", "Bélgica", "Croacia"],
        topScorer: players.slice(0, 4),
        mvp: ["Jude Bellingham", "Lamine Yamal", "Kylian Mbappé", "Vinícius Júnior"],
        surprise: ["Marruecos", "Japón", "Senegal", "Cabo Verde"],
        disappointment: ["Alemania", "Portugal", "Bélgica", "Inglaterra"]
      };
      return `
        <div class="section-head">
          <div><h2>Predicciones extra</h2><p>Rellena tus apuestas especiales o usa una sugerencia rápida.</p></div>
        </div>
        <div class="grid extras-grid">
          ${extraFields.map(([key, label, type]) => {
            const placeholder = type === "Jugador" ? "Escribe un jugador" : "Escribe una selección";
            const selected = prediction().extras[key] || "";
            return `<article class="extra-card">
              <label>${label}</label>
              <div class="extra-input-wrap">
                <input value="${escapeHtml(selected)}" placeholder="${placeholder}" oninput="updateExtra('${key}', this.value)" />
                <div class="suggestions">
                  ${suggestions[key].map(option => `<button class="suggestion-chip" onclick='updateExtra(${jsArg(key)}, ${jsArg(option)})'>${escapeHtml(option)}</button>`).join("")}
                </div>
              </div>
            </article>`;
          }).join("")}
        </div>
      `;
    }

    function updateExtra(key, value) {
      prediction().extras[key] = value;
      prediction().activity.unshift(`Extra actualizado: ${extraFields.find(field => field[0] === key)?.[1] || key}`);
      saveState();
      render();
    }

    function renderPlayers() {
      return `
        <div class="section-head">
          <div><h2>Participantes</h2><p>Predicciones independientes por jugador y guardado automático local.</p></div>
        </div>
        <article class="card card-pad">
          <form class="player-form" onsubmit="addPlayer(event)">
            <input id="playerName" placeholder="Nombre del participante" maxlength="32" required />
            <button class="primary-btn" type="submit">Añadir jugador</button>
          </form>
        </article>
        <div class="grid three" style="margin-top:18px">
          ${state.players.map(renderPlayerCard).join("")}
        </div>
      `;
    }

    function renderPlayerCard(player) {
      const active = player.id === state.activePlayerId;
      const date = new Date(player.createdAt).toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
      return `
        <article class="player-card ${active ? "active" : ""}">
          <span class="avatar">${initials(player.name)}</span>
          <div class="player-meta">
            <strong class="truncate">${escapeHtml(player.name)}</strong>
            <div class="small">Creado ${date}</div>
          </div>
          <button class="ghost-btn" onclick="selectPlayer('${player.id}')">${active ? "Activo" : "Usar"}</button>
          <button class="danger-btn" onclick="deletePlayer('${player.id}')" ${state.players.length === 1 ? "disabled" : ""}>Eliminar</button>
        </article>
      `;
    }

    function initials(name) {
      return name.split(/\s+/).slice(0, 2).map(part => part[0]).join("").toUpperCase();
    }

    function addPlayer(event) {
      event.preventDefault();
      const input = document.getElementById("playerName");
      const player = createPlayer(input.value);
      state.players.push(player);
      state.activePlayerId = player.id;
      state.predictions[player.id] = defaultPrediction();
      saveState();
      render();
    }

    function selectPlayer(id) {
      state.activePlayerId = id;
      saveState();
      render();
    }

    function deletePlayer(id) {
      if (state.players.length === 1) return;
      state.players = state.players.filter(player => player.id !== id);
      delete state.predictions[id];
      if (state.activePlayerId === id) state.activePlayerId = state.players[0].id;
      saveState();
      render();
    }

    /* =========================================================
       Reglas
       ========================================================= */
    function renderRules() {
      const rules = [
        ["+2", "Acertar clasificado"],
        ["+3", "Acertar posición exacta"],
        ["+5", "Acertar ganador eliminatoria"],
        ["+8", "Acertar resultado exacto"],
        ["+15", "Acertar campeón"],
        ["+10", "Acertar pichichi"],
        ["+10", "Acertar mejor jugador"]
      ];
      return `
        <div class="section-head">
          <div><h2>Reglas de la porra</h2><p>Cuota de participación: <strong>5€</strong>. Gana quien más puntos acumule al finalizar el torneo.</p></div>
        </div>
        <div class="grid two">
          <article class="card card-pad">
            <h2>Cómo se juega</h2>
            <div class="grid">
              <div class="rule-card"><span class="rule-icon">1</span><span>Completa todos los grupos seleccionando primero y segundo.</span></div>
              <div class="rule-card"><span class="rule-icon">2</span><span>Desbloquea eliminatorias e introduce resultados y penaltis si hay empate.</span></div>
              <div class="rule-card"><span class="rule-icon">3</span><span>Rellena extras antes del inicio y revisa el campeón final destacado.</span></div>
            </div>
          </article>
          <article class="card card-pad">
            <h2>Sistema de puntuación</h2>
            <div class="grid">
              ${rules.map(([points, label]) => `<div class="rule-card"><span class="rule-icon">${points}</span><span>${label}</span></div>`).join("")}
            </div>
          </article>
        </div>
      `;
    }

    window.addEventListener("load", () => {
      render();
      setInterval(() => state.activeTab === "home" && render(), 60000);
      setTimeout(() => document.getElementById("loader").classList.add("is-hidden"), 550);
    });
  </script><h1>Mi web</h1>

  <button onclick="toggleTheme()">🌙 Modo oscuro</button>

</body>
</html>
